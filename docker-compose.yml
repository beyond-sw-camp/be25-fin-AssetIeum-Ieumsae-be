services:
  app:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY:-assetieum-be}:latest
    container_name: assetieum-be
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HIKARI_MAXIMUM_POOL_SIZE: ${DB_HIKARI_MAXIMUM_POOL_SIZE:-5}
      DB_HIKARI_MINIMUM_IDLE: ${DB_HIKARI_MINIMUM_IDLE:-1}
      DB_HIKARI_CONNECTION_TIMEOUT: ${DB_HIKARI_CONNECTION_TIMEOUT:-30000}
      DB_HIKARI_IDLE_TIMEOUT: ${DB_HIKARI_IDLE_TIMEOUT:-600000}
      DB_HIKARI_MAX_LIFETIME: ${DB_HIKARI_MAX_LIFETIME:-1800000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AWS_S3_ENABLED: ${AWS_S3_ENABLED:-true}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL}
      AWS_S3_MAX_FILE_SIZE_BYTES: ${AWS_S3_MAX_FILE_SIZE_BYTES:-10485760}
      AWS_S3_ALLOWED_EXTENSIONS: ${AWS_S3_ALLOWED_EXTENSIONS:-jpg,jpeg,png,pdf,doc,docx,xls,xlsx}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: assetieum-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
