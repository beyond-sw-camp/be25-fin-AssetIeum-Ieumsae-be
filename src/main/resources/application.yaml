spring:
  application:
    name: assetieum-be

  profiles:
    default: local

  jackson:
    time-zone: Asia/Seoul

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
    refresh-token-grace-period-seconds: ${JWT_REFRESH_TOKEN_GRACE_PERIOD_SECONDS:30}
  refresh-token-cookie:
    secure: true
    same-site: Strict

cloud:
  aws:
    s3:
      enabled: ${AWS_S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      max-file-size-bytes: ${AWS_S3_MAX_FILE_SIZE_BYTES:10485760}
      allowed-extensions: ${AWS_S3_ALLOWED_EXTENSIONS:jpg,jpeg,png,pdf,doc,docx,xls,xlsx}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
