spring:
  application:
    name: assetieum-be

  profiles:
    default: local

  jackson:
    time-zone: Asia/Seoul

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:assetieum-local}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ieumsae.assetieum.global.kafka
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fasterxml.jackson.databind.JsonNode
    listener:
      ack-mode: record
      missing-topics-fatal: false

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
    refresh-token-grace-period-seconds: ${JWT_REFRESH_TOKEN_GRACE_PERIOD_SECONDS:30}
  refresh-token-cookie:
    secure: true
    same-site: Strict

cloud:
  aws:
    s3:
      enabled: ${AWS_S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      max-file-size-bytes: ${AWS_S3_MAX_FILE_SIZE_BYTES:10485760}
      allowed-extensions: ${AWS_S3_ALLOWED_EXTENSIONS:jpg,jpeg,png,pdf,doc,docx,xls,xlsx}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  kafka:
    topics:
      smoke-test: ${KAFKA_SMOKE_TEST_TOPIC:assetieum.test.v1}
      activity-log: ${KAFKA_ACTIVITY_LOG_TOPIC:assetieum.activity-log.v1}
      audit-log: ${KAFKA_AUDIT_LOG_TOPIC:assetieum.audit-log.v1}
      notification: ${KAFKA_NOTIFICATION_TOPIC:assetieum.notification.v1}
    smoke-test:
      enabled: ${KAFKA_SMOKE_TEST_ENABLED:false}
    log:
      enabled: ${KAFKA_LOG_ENABLED:false}
    notification:
      enabled: ${KAFKA_NOTIFICATION_ENABLED:false}
    dashboard-cache:
      enabled: ${KAFKA_DASHBOARD_CACHE_ENABLED:false}
      ttl-seconds: ${DASHBOARD_CACHE_TTL_SECONDS:30}
      warmup-enabled: ${DASHBOARD_CACHE_WARMUP_ENABLED:true}
    outbox:
      publish-interval-ms: ${KAFKA_OUTBOX_PUBLISH_INTERVAL_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
