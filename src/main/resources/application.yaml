spring:
  application:
    name: assetieum-be

  profiles:
    default: local

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
    refresh-token-grace-period-seconds: ${JWT_REFRESH_TOKEN_GRACE_PERIOD_SECONDS:30}
  refresh-token-cookie:
    secure: true
    same-site: Strict

cloud:
  aws:
    s3:
      enabled: ${AWS_S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
