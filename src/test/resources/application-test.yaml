spring:
  datasource:
    url: jdbc:h2:mem:assetieum-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
    open-in-view: false

  flyway:
    enabled: false

  batch:
    job:
      enabled: false

  kafka:
    listener:
      auto-startup: false

logging:
  level:
    root: info
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off

auth:
  jwt:
    secret: assetieum-test-jwt-secret-change-me-to-be-more-than-64-characters-long-now
    issuer: assetieum-test
    audience: assetieum-test-client
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 14
    refresh-token-grace-period-seconds: 30
  refresh-token-cookie:
    secure: false
    same-site: Strict

cloud:
  aws:
    s3:
      enabled: false

app:
  notification:
    sse:
      redis-enabled: false
